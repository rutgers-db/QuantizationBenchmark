# Configuration for HVS graph index
# HVS has integrated hierarchical quantization, no external quantizer needed

sift-128-euclidean:
  common:
    num_threads: 4
  build:
    max_level: [1]
    delta: [0.5]
    efConstruction: [50]
    M: [32]
  search:
    - topk: 10
      efsearch: [10, 20, 30, 40, 50, 75, 100, 200, 300, 400, 500, 750, 1000]

siftsmall-128-euclidean:
  common:
    num_threads: 8
  build:
    max_level: [1]
    delta: [0.5]
    efConstruction: [500]
    M: [16]
  search:
    - topk: 10
      efsearch: [100, 500, 1000]

