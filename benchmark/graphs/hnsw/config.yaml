# Configuration for HNSW graph index with pluggable quantizers

sift-128-euclidean:
  common:
    num_threads: 4     # Number of threads
    metric: "l2"       # Distance metric
  build:
    M: [16]            # Max connections per node
    ef_construction: [50]  # Construction time search width
  search:
    - topk: 10
      ef: [10, 20, 30, 40, 50, 75, 100, 200, 500]

siftsmall-128-euclidean:
  common:
    num_threads: 8
    metric: "l2"
  build:
    M: [16]
    ef_construction: [100, 200]
  search:
    - topk: 10
      ef: [20, 50, 100, 200]
