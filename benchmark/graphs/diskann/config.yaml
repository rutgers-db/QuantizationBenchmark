# Configuration for DiskANN graph index with pluggable quantizers

sift-128-euclidean:
  common:
    R: 32              # Max out-degree
    num_threads: 4    # Number of threads
    metric: "l2"       # Distance metric
  build:
    L: [50]      # Build complexity
  search:
    - topk: 10
      search_L: [50]
      beam_width: [4]  # Match test_diskann.py for fair comparison

siftsmall-128-euclidean:
  common:
    R: 32              # Smaller degree for smaller dataset
    num_threads: 8
    metric: "l2"
  build:
    L: [50, 100]
  search:
    - topk: 10
      search_L: [20, 50, 100]
      beam_width: [2, 4]
