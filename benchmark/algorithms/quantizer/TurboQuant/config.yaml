sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
    mode: "mse"
    use_data_centroid: true
  build:
    bitwidth: [1,4,8]
    nlist: 1
  search:
    - topk: 100
      nprobe: 1
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 10
      nprobe: 1
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 50
      nprobe: 1
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]

