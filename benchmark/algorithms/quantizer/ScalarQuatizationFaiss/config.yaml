# Configuration for Scalar Quantization using Faiss

sift-128-euclidean:
  # Scalar Quantization with build/search separation format
  # Automatically generates all combinations based on nbit values
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [4]  # Bits per component (4-bit, 6-bit, 8-bit)
  search:
    - topk: 100
      nrerank: [200, 300, 500, 800, 1000]

