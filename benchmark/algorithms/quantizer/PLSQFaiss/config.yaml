sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nsplits: [4]
    nsubvec: [8]
    nbit: [8]
  search:
    - topk: 10
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 50
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 100
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]

