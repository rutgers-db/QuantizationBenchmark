# Configuration for VAQ (Vector Adaptive Quantization)

siftsmall-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    bit_budget: 256
    subspace_num: 32
    min_bits: 7
    max_bits: 13
    var_explained: 1.0
    search_method: "SORT"
  search:
    - topk: 100
      nrerank: [200, 300, 500, 800, 1000]

