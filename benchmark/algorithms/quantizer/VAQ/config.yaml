# Configuration for VAQ (Vector Adaptive Quantization)

siftsmall-128-euclidean:
  # Build/Search separation format with per-topk nrerank
  common:
    data_bytes: 4      # Data type size in bytes (float32)
    ndim: 128          # Dimensionality
    nthread: 16        # Number of threads for parallel processing
    space: "l2"        # Distance metric (l2 for Euclidean distance)

  build:
    # VAQ training parameters (smaller settings for siftsmall)
    bit_budget: 256        # Total bits per encoded vector
    subspace_num: 32       # Number of subvectors to split the vector into
    min_bits: 7            # Minimum bits per segment
    max_bits: 13           # Maximum bits per segment
    var_explained: 1.0     # Variance threshold (1.0 = no variance-based compression)
    search_method: "SORT"  # Search algorithm: SORT, EA (Early Abandon), Heap, TI, etc.

  search:
    # List format: each topk can have its own nrerank values
    - topk: 10           # topk=10, no rerank
    - topk: 50
      nrerank: [100]     # topk=50 with nrerank=[100]
    - topk: 100
      nrerank: [200, 300]  # topk=100 with nrerank=[200, 300]

sift-128-euclidean:
  # Build/Search separation format with per-topk nrerank
  common:
    data_bytes: 4      # Data type size in bytes (float32)
    ndim: 128          # Dimensionality
    nthread: 16        # Number of threads for parallel processing
    space: "l2"        # Distance metric (l2 for Euclidean distance)

  build:
    # VAQ training parameters
    bit_budget: 256        # Total bits per encoded vector (e.g., 256 bits = 32 bytes)
    subspace_num: 32       # Number of subvectors to split the vector into
    min_bits: 7            # Minimum bits per segment
    max_bits: 13           # Maximum bits per segment
    var_explained: 1.0     # Variance threshold (1.0 = no variance-based compression)
    search_method: "SORT"  # Search algorithm: SORT, EA (Early Abandon), Heap, TI, etc.

  search:
    # List format: each topk can have its own nrerank values
    - topk: 100
      nrerank: 200       # topk=100 with nrerank=200
