sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 32
    space: "l2"
  build:
    nsubvec: [16,32]
    nbit: [4,8]
    nlist: [4096]
  search:
    - topk: 10
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 50
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 100
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    # - topk: 10
    #   nrerank: [10,20]
  