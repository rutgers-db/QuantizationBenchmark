# Configuration for RaBitQ (Randomized Bit Quantization)
# RaBitQ without IVF (C=1, single centroid = data mean)

sift-128-euclidean:
  # Build/Search separation format
  common:
    data_bytes: 4      # Data type size in bytes (float32)
    ndim: 128          # Dimensionality
    nthread: 16        # Number of threads for parallel processing
    space: "l2"        # Distance metric (l2 for Euclidean distance)
  build:
    nlist: [256]
  search:
    - topk: 100          # Number of nearest neighbors to retrieve (default: 100)
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [100]
    - topk: 10
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [10]
    - topk: 50
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [50]

