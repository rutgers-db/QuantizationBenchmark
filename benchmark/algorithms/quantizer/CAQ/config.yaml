sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [2, 3, 4, 6, 8]
    nlist: [4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [200, 300, 500, 800, 1000]

