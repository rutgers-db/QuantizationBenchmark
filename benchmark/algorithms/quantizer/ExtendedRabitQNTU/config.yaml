sift-128-euclidean:
  # ExtendedRabitQNTU with build/search separation format
  # Automatically generates all combinations based on build parameters
  common:
    data_bytes: 4
    ndim: 128
    high_acc_flag: [False, True]
    # space: "l2"
    nthread: 16
  build:
    nbit: [2,3,4,6,8]
    nlist: [1]
  search:
    - topk: 100          # Number of nearest neighbors to retrieve (default: 100)
      nprobe: [1]
      nrerank: [100]
    - topk: 10
      nprobe: [1]
      nrerank: [10]
    - topk: 50
      nprobe: [1]
      nrerank: [50]

