sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [1,2,4]
    nlist: [1]
  search:
    - topk: 100
      nprobe: [1]
      nrerank: [200, 300, 500, 800, 1000]

