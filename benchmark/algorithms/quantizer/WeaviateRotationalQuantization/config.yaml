# Weaviate Rotational Quantization
# bits = 1 -> BRQ path; bits in {2,4,8} -> uniform RQ path.

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    bits: [1, 2, 4]
  search:
    - topk: 100
      nrerank: [200, 300, 500, 800, 1000]

