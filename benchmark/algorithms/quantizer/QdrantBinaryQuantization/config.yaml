laion-768-ip:
  # encoding=1 -> 32x, encoding=2 -> 16x; QdrantBQ cannot reach 8x.
  common:
    data_bytes: 4
    ndim: 768
    nthread: 16
    space: "ip"
  build:
    encoding: [1]
    query_encoding: ["scalar8"]
  search:
    - topk: 100
