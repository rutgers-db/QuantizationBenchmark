# Qdrant Binary Quantization
#
# encoding       : 1 = OneBit (sign around mean), 2 = TwoBits (mean ± 2/3·std)
# query_encoding : "same" | "scalar4" | "scalar8"
# metric         : "l2" | "ip" | "hamming"

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    encoding: [1, 2]
  search:
    - topk: 100
      query_encoding: ["same", "scalar4", "scalar8"]
      nrerank: [200, 300, 500, 800, 1000]

