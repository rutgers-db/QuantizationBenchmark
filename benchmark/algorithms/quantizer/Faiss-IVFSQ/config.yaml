# Configuration for IVF + Scalar Quantization using Faiss

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [4, 6, 8]  # Bits per component for scalar quantization
    nlist: [1024, 2048, 4096, 8192]  # Number of IVF clusters
  search:
    - topk: 10
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 50
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 100
      nprobe: [10, 20, 30, 40, 50, 75, 100, 250, 500, 750, 1000]
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]

