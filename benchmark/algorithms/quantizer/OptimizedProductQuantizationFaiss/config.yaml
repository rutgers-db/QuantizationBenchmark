sift-128-euclidean:
  # Product Quantization with build/search separation format
  # Automatically generates all combinations based on build parameters
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    niter : [50]
    nsubvec: [16, 32, 64]
    nbit: [8]
  search:
    - topk: 100
      nrerank: [200, 300, 500, 800, 1000]

