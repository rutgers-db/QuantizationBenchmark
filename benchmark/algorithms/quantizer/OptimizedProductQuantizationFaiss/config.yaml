sift-128-euclidean:
  # Product Quantization with build/search separation format
  # Automatically generates all combinations based on build parameters
  common:
    data_bytes: 4
    ndim: 128
    nthread: 4
    space: "l2"
  build:
    nthread: 1
    niter : [20,30]
    nsubvec: [16, 32]
    nbit: [4]
  search:
    topk: 100  # Number of nearest neighbors to retrieve (default: 100)