sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nsubvec: [16, 32, 64]
    nbit: [4, 8]
  search:
    - topk: 100
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 10
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]
    - topk: 50
      nrerank: [100, 200, 300, 400, 500, 1000, 1500, 2500]

