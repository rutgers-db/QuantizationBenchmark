sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nsubvec: [32]
    nbit: [8]
    max_beam_size: [10]
  search:
    - topk: 100
      nrerank: [200, 300, 500, 800, 1000]

