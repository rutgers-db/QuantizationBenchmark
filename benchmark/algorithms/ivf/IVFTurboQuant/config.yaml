laion-768-ip:
  common:
    data_bytes: 4
    ndim: 768
    nthread: 16
    space: "ip"
    mode: "ip"
    use_data_centroid: true
  build:
    # IP mode: bitwidth-1 bits for centroid + 1 bit QJL = bitwidth bits total.
    # bitwidth=1 -> 32x, bitwidth=2 -> 16x, bitwidth=4 -> 8x compression.
    bitwidth: [4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [100]
      # nrerank: [200, 300, 500, 1000]
