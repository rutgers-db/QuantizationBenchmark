# IVF + Weaviate Rotational Quantization on residuals.
#
# bits           : 1 (BRQ path) or 2 | 4 | 8 (uniform RQ path)
# nlist / nprobe : standard IVF parameters.

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    bits: [1, 2, 4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [100]
      nrerank: [200, 300, 500, 1000]

