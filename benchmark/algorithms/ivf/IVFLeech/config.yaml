# Configuration for IVFLeech (Λ24 Leech-lattice 1-bit with IVF).
# Codes are 18-bit indices packed into 3 bytes per 24-dim block (1 bit/dim).

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

