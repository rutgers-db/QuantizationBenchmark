sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nsubvec: [32, 128]
    nbit: [4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [100]
      # nrerank: [200, 300, 500, 1000]

