laion-768-ip:
  common:
    data_bytes: 4
    ndim: 768
    nthread: 16
    space: "ip"
  build:
    # nbit=4 fixed for FastScan; nsubvec=192 -> 32x, 384 -> 16x, 768 -> 8x compression
    nsubvec: [768]
    nbit: [4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [100]
      # nrerank: [200, 300, 500, 1000]
