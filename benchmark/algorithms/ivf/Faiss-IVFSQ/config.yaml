# Configuration for IVF + Scalar Quantization using Faiss

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [4]  # Bits per component for scalar quantization
    nlist: [1024, 4096]  # Number of IVF clusters
  search:
    - topk: 100
      nprobe: [100]
      # nrerank: [200, 300, 500, 1000]

