# Configuration for IVFTrellis (TCQ-style 2-bit-per-dim with IVF).
# K=2 bits/step, S=64 states ⇒ in-register vpermi2b kernel.

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

gist-960-euclidean:
  common:
    data_bytes: 4
    ndim: 960
    nthread: 16
    space: "l2"
  build:
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]
