# Configuration for IVFE8PQ (learned PQ codebook on normalized residuals,
# RaBitQ-style scoring). Same nsubvec / nbit knobs as Faiss-IVFPQ.
# Constraint: nsubvec must divide padded_dim (= round_up(ndim, 64));
# the C++ scan currently only supports nbit=8.

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nlist: [1024]
    nsubvec: [16]
    nbit: [8]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      # nrerank: [200, 300, 500, 1000]

gist-960-euclidean:
  common:
    data_bytes: 4
    ndim: 960
    nthread: 16
    space: "l2"
  build:
    nlist: [1024, 4096]
    nsubvec: [120, 480]
    nbit: [8]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

