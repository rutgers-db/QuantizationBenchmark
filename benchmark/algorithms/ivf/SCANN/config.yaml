sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    num_leaves: [1024, 2048, 4096, 8192]
    dims_per_block: [1,2,4]
  search:
    - topk: 100
      num_leaves_to_search: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

