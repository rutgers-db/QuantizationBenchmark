laion-768-ip:
  common:
    data_bytes: 4
    ndim: 768
    nthread: 16
    space: "ip"
  build:
    num_leaves: [1024, 4096]
    # lut16 = 4 bits/block. dims_per_block=1 -> 8x, =2 -> 16x, =4 -> 32x compression.
    dims_per_block: [1, 2, 4]
    hash_type: ["lut16"]
  search:
    - topk: 100
      num_leaves_to_search: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]
