# Configuration for IVFRabitQLibrary (RaBitQ with IVF)
# Uses multiple IVF clusters (nlist) with nprobe-based search

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [100]
      # nrerank: [200, 300, 500, 1000]

gist-960-euclidean:
  common:
    data_bytes: 4
    ndim: 960
    nthread: 16
    space: "l2"
  build:
    nbit: [1,4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

