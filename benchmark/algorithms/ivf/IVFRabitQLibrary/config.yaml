    data_bytes: 4
    ndim: 768
    nthread: 16
    space: "ip"
  build:
    # nbit=1 -> 32x, nbit=2 -> 16x, nbit=4 -> 8x compression
    nbit: [1, 2, 4]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]
