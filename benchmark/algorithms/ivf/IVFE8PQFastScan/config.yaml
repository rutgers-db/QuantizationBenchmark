# Configuration for IVFE8PQFastScan (learned PQ codebook on normalized residuals,
# RaBitQ-style scoring, PQ-fastscan-style register-resident uint8 LUT).
# Same nsubvec / nbit knobs as IVFE8PQ; nbit must be 8 (1-byte codes, 256-entry LUT).

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nlist: [1024]
    nsubvec: [16, 32, 64]
    nbit: [8]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      # nrerank: [200, 300, 500, 1000]

gist-960-euclidean:
  common:
    data_bytes: 4
    ndim: 960
    nthread: 16
    space: "l2"
  build:
    nlist: [1024]
    nsubvec: [120, 240]
    nbit: [8]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      # nrerank: [200, 300, 500, 1000]

