sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    nbit: [4,8]
    nlist: [1024, 2048]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [100]
    - topk: 10
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [10]
    - topk: 50
      nprobe: [10, 20, 30, 40, 50, 75, 100]
      nrerank: [50]

