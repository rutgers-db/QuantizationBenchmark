# IVF + Qdrant Binary Quantization on residuals.
#
# encoding       : 1 = OneBit (sign around mean), 2 = TwoBits (mean ± 2/3·std)
# query_encoding : "same" | "scalar4" | "scalar8"
# nlist / nprobe : standard IVF parameters.

sift-128-euclidean:
  common:
    data_bytes: 4
    ndim: 128
    nthread: 16
    space: "l2"
  build:
    encoding: [1, 2]
    query_encoding: ["same", "scalar4", "scalar8"]
    nlist: [1024, 4096]
  search:
    - topk: 100
      nprobe: [10, 20, 30, 50, 75, 100]
      nrerank: [200, 300, 500, 1000]

